name: Deploy database (Supabase)

# Creates/updates all tables, security policies, storage and the Edge Functions.
# Run it from the Actions tab ("Run workflow"). It also runs automatically when
# anything in supabase/ changes on main. Needs 3 repository secrets:
#   SUPABASE_ACCESS_TOKEN  – supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   – the code in your project URL (https://<ref>.supabase.co)
#   SUPABASE_DB_PASSWORD   – the database password chosen when creating the project
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/**']

concurrency: supabase-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      # Fails loudly: a green tick on this workflow must mean the database
      # really was deployed, never that the step was quietly skipped.
      - name: Check secrets
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$PROJECT_REF" ]           && missing="$missing SUPABASE_PROJECT_REF"
          [ -z "$SUPABASE_DB_PASSWORD" ]  && missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error title=Supabase is not connected yet::Missing repository secret(s):$missing"
            echo ""
            echo "Nothing was deployed. Add the secret(s) here, then run this workflow again:"
            echo "  Settings -> Secrets and variables -> Actions -> New repository secret"
            echo ""
            echo "  SUPABASE_ACCESS_TOKEN  supabase.com/dashboard/account/tokens"
            echo "  SUPABASE_PROJECT_REF   the code in https://<ref>.supabase.co"
            echo "  SUPABASE_DB_PASSWORD   the password set when creating the project"
            exit 1
          fi
          echo "All three secrets are present. Deploying..."
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply database migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD" --include-all
      - name: Deploy Edge Functions
        run: |
          supabase functions deploy payroll --project-ref "$PROJECT_REF"
          supabase functions deploy invite-user --project-ref "$PROJECT_REF"
      - name: Set function secrets
        if: env.SITE_URL != ''
        run: supabase secrets set SITE_URL="$SITE_URL" ALLOWED_ORIGIN="$SITE_URL" --project-ref "$PROJECT_REF"
      - name: Summary
        run: |
          echo "### Database deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Tables, security rules, storage and the payroll functions are live on project \`$PROJECT_REF\`." >> "$GITHUB_STEP_SUMMARY"
