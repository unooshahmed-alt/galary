name: Deploy database (Supabase)

# Creates/updates all tables, security policies, storage and the Edge Functions.
# Run it from the Actions tab ("Run workflow"). It also runs automatically when
# anything in supabase/ changes on main. Needs 3 repository secrets:
#   SUPABASE_ACCESS_TOKEN  – supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   – the code in your project URL (https://<ref>.supabase.co)
#   SUPABASE_DB_PASSWORD   – the database password chosen when creating the project
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/**']

concurrency: supabase-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Supabase secrets are not set yet — skipping. See docs/DEPLOYMENT.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'true'
        with: { version: latest }
      - name: Link project
        if: steps.check.outputs.ready == 'true'
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply database migrations
        if: steps.check.outputs.ready == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD" --include-all
      - name: Deploy Edge Functions
        if: steps.check.outputs.ready == 'true'
        run: |
          supabase functions deploy payroll --project-ref "$PROJECT_REF"
          supabase functions deploy invite-user --project-ref "$PROJECT_REF"
      - name: Set function secrets
        if: steps.check.outputs.ready == 'true' && env.SITE_URL != ''
        run: supabase secrets set SITE_URL="$SITE_URL" ALLOWED_ORIGIN="$SITE_URL" --project-ref "$PROJECT_REF"
